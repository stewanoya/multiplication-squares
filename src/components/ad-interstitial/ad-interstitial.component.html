<div class="interstitial-wrapper">
  <div class="ad-label">Advertisement</div>

  <div class="ad-content">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-8214495116993881"
         data-ad-slot="9659867780"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>

  <div class="footer">
    <button
      mat-raised-button
      color="primary"
      class="continue-btn"
      [disabled]="!canContinue"
      (click)="continue()"
    >
      {{ canContinue ? "Let's Play!" : "Continue in " + countdown + "…" }}
    </button>
  </div>
</div>
