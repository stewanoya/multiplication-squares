<app-celebration [visible]="celebrationVisible" [message]="celebrationMessage" />

<p class="page-description" *ngIf="variant">
  {{ variant.label }} Squares &mdash; {{ variant.gradeRange }}
</p>

<div *ngIf="game" class="game__container">
  <mat-card class="board__container">
    <h1 class="board-title">{{ variant?.label }} Squares</h1>
    <div class="board-wrapper">
      <div *ngFor="let row of game.currentBoard; let rowIndex = index;" class="board-row">
        <div [style.background-color]="cell.fillColor"
             [class.cell--filled]="!!cell.fillColor"
             class="cell"
             *ngFor="let cell of row;">
          <line-segment
          *ngIf="rowIndex === 0"
          (segmentClickEvent)="onSegmentSelected($event, row, rowIndex)"
          [orientation]="'horiz'"
          [game]="game"
          [firstRow]="true"
          [neighbourCells]="getNeighbourCells(row, rowIndex, cell, 'horiz', true)"/>
          <line-segment
          [game]="game"
          (segmentClickEvent)="onSegmentSelected($event, row, rowIndex)"
          [orientation]="'horiz'"
          [neighbourCells]="getNeighbourCells(row, rowIndex, cell, 'horiz')"/>
          <line-segment
          *ngIf="cell.index === 0"
          [game]="game"
          (segmentClickEvent)="onSegmentSelected($event, row, rowIndex)"
          [orientation]="'vert'"
          [firstCell]="true"
          [neighbourCells]="getNeighbourCells(row, rowIndex, cell, 'vert', true)"/>
          <line-segment
          (segmentClickEvent)="onSegmentSelected($event, row, rowIndex)"
          [orientation]="'vert'"
          [game]="game"
          [neighbourCells]="getNeighbourCells(row, rowIndex, cell, 'vert')"/>
          <div class="cell-value">{{ cell.value }}</div>
        </div>
      </div>
      <div class="dot-overlay" aria-hidden="true">
        <div *ngFor="let d of dotGrid" class="dot-overlay__dot"></div>
      </div>
    </div>
  </mat-card>

  <div class="info-section__container">
    <mat-card class="info-card">
      <dice (onDrawEvent)="openDrawPopup()" (skipTurnEvent)="onSkipTurnEvent()" (diceRolledEvent)="onDiceRolledEvent()" [diceRolled]="diceRolled" [game]="game" (diceValuesEvent)="onDiceValueUpdate($event)" />
    </mat-card>

    <mat-card class="info-card turn-card">
      <p class="section-label">Current Turn</p>
      <div class="turn-badge" [style.background-color]="game.currentPlayerTurn.color">
        {{ game.currentPlayerTurn.name }}
      </div>
    </mat-card>

    <mat-card class="info-card score-card">
      <p class="section-label">Scores</p>
      <div *ngFor="let player of game.players" class="score-row">
        <span class="score-name" [style.background-color]="player.color">{{ player.name }}</span>
        <span class="score-val">{{ player.score }}</span>
      </div>
    </mat-card>

    <div>
      <button (click)="onResetGame()" mat-button>Reset game</button>
    </div>
  </div>
</div>
