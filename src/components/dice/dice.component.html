<div *ngIf="firstDie" class="dice-section__container">

  <div class="dice-header">
    <h3 class="dice-title">{{ sectionTitle }}</h3>
    <button class="view-toggle" (click)="toggleViewMode()" type="button">
      {{ viewMode === 'dice' ? 'Spinner view' : 'Dice view' }}
    </button>
    <button class="mode-toggle" (click)="toggleDiceMode()" type="button"
            *ngIf="viewMode === 'dice' && !isSingleSpinner">
      {{ diceMode === 'number' ? 'Pip view' : 'Number view' }}
    </button>
  </div>

  <!-- Dice view -->
  <div *ngIf="viewMode === 'dice'" class="dice-row">
    <!-- Die 1 -->
    <ng-container *ngIf="die1Raw !== null; else emptyDie1">
      <div class="die" [class.die--rolling]="isRolling">
        <span *ngIf="diceMode === 'number' || isSingleSpinner" class="die-number">{{ die1Display }}</span>
        <div *ngIf="diceMode === 'pip' && !isSingleSpinner"
             class="pip-grid"
             [style.grid-template-rows]="'repeat(' + pipGridRows(die1Raw) + ', 1fr)'">
          <span *ngFor="let pip of getPipPositions(die1Raw)"
                class="pip"
                [style.grid-row]="pip.r"
                [style.grid-column]="pip.c">
          </span>
        </div>
      </div>
    </ng-container>
    <ng-template #emptyDie1>
      <div class="die die--empty">
        <span class="die-number die-number--placeholder">?</span>
      </div>
    </ng-template>

    <!-- Fixed label (single spinner) or second die (dual spinner) -->
    <ng-container *ngIf="isSingleSpinner; else dualDie">
      <span class="multiply-sign">{{ fixedLabel }}</span>
    </ng-container>

    <ng-template #dualDie>
      <span class="multiply-sign">{{ dualOperator }}</span>

      <ng-container *ngIf="die2Raw !== null; else emptyDie2">
        <div class="die" [class.die--rolling]="isRolling">
          <span *ngIf="diceMode === 'number'" class="die-number">{{ die2Raw }}</span>
          <div *ngIf="diceMode === 'pip'"
               class="pip-grid"
               [style.grid-template-rows]="'repeat(' + pipGridRows(die2Raw) + ', 1fr)'">
            <span *ngFor="let pip of getPipPositions(die2Raw)"
                  class="pip"
                  [style.grid-row]="pip.r"
                  [style.grid-column]="pip.c">
            </span>
          </div>
        </div>
      </ng-container>
      <ng-template #emptyDie2>
        <div class="die die--empty">
          <span class="die-number die-number--placeholder">?</span>
        </div>
      </ng-template>
    </ng-template>
  </div>

  <!-- Spinner view -->
  <div *ngIf="viewMode === 'spinner'" class="dice-row">
    <spinner-wheel
      [maxValue]="game!.maxValue"
      [targetValue]="spinner1Target"
      [spinKey]="spinKey"
      [displayValue]="die1Display">
    </spinner-wheel>
    <ng-container *ngIf="isSingleSpinner">
      <span class="multiply-sign">{{ fixedLabel }}</span>
    </ng-container>
    <ng-container *ngIf="!isSingleSpinner">
      <span class="multiply-sign">{{ dualOperator }}</span>
      <spinner-wheel
        [maxValue]="game!.maxValue"
        [targetValue]="spinner2Target"
        [spinKey]="spinKey"
        [displayValue]="die2Raw">
      </spinner-wheel>
    </ng-container>
  </div>

  <div class="dice-buttons">
    <button [disabled]="diceRolled" mat-flat-button color="accent" (click)="onRollClick()">{{ rollButtonLabel }}</button>
    <button [disabled]="!diceRolled" mat-button (click)="onDrawClick()">Draw it out</button>
    <button [disabled]="!isResultReady" mat-flat-button color="warn" (click)="onSkipTurnClick()">Skip Turn</button>
  </div>
</div>
